services:
  db:
    image: "postgres:12-alpine"
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=simplebank
    
  
  api:
    build: 
     context: .
     dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_SOURCE=postgres://root:secret@db:5432/simpleBank?sslmode=disable
      - SERVER_ADDRESS=0.0.0.0:8080
    depends_on:
      - db
